name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Core self-test (includes adversarial cheat regression)
        run: python scripts/self_test.py
      - name: Memory self-test
        run: python scripts/memory_selftest.py
      - name: Skill compiler self-test
        run: python scripts/skills_selftest.py
      - name: Dream pass self-test
        run: python scripts/dream_selftest.py
      - name: Scheduler dream-budget self-test
        run: python scripts/schedule_selftest.py
      - name: First-turn memory budget self-test
        run: python scripts/first_turn_budget_selftest.py
      - name: Knowledge-store concurrency (50 consecutive runs)
        run: python scripts/atomic_io_selftest.py --loop 50