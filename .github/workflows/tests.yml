name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Core self-test
        run: python scripts/self_test.py
      - name: Memory self-test
        run: python scripts/memory_selftest.py
      - name: Skill compiler self-test
        run: python scripts/skills_selftest.py
      - name: CannBench contract self-test
        run: python scripts/cannbench_selftest.py
      - name: Evaluation policy self-test
        run: python scripts/policy_selftest.py
      - name: Causal attribution self-test
        run: python scripts/causality_selftest.py
      - name: Meta-eval smoke
        run: python scripts/meta_eval.py --tag ci-smoke --seeds 2 --evals 8 --tokens 1200 --threshold 2.2
      - name: Search policy self-test
        run: python scripts/search_selftest.py
      - name: Structure/parameter self-test
        run: python scripts/params_selftest.py
      - name: Roofline and memory-query self-test
        run: python scripts/roofline_selftest.py
      - name: Soft-scope and failure-similarity self-test
        run: python scripts/soft_scope_selftest.py